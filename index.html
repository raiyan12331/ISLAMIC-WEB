<!DOCTYPE html>
<html lang="bn" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Firdaus — Personal Amal & Note Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent: #0d9488;
      --accent-soft: rgba(13, 148, 136, 0.14);
      --bg-page: #edf3f1;
      --bg-surface: #f7faf9;
      --bg-elevated: #ffffff;
      --bg-input: #e6efec;
      --text-main: #0f2922;
      --text-dim: #527067;
      --border-line: rgba(15, 41, 34, 0.11);
      --shadow-main: 0 18px 42px rgba(15, 41, 34, 0.08);
      --admin: #7c3aed;
      --admin-soft: rgba(124, 58, 237, 0.12);
      --danger: #dc2626;
      --success: #059669;
      --gold: #d97706;
    }

    html[data-theme="dark"] {
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.16);
      --bg-page: #071117;
      --bg-surface: #0d1b24;
      --bg-elevated: #132734;
      --bg-input: #081218;
      --text-main: #f0f9ff;
      --text-dim: #94b3c4;
      --border-line: rgba(186, 230, 253, 0.14);
      --shadow-main: 0 22px 54px rgba(0, 0, 0, 0.5);
      --admin: #c084fc;
      --admin-soft: rgba(192, 132, 252, 0.16);
      --danger: #f87171;
      --success: #34d399;
      --gold: #fbbf24;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Hind Siliguri', 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      background-color: var(--bg-page);
      background-image: radial-gradient(circle at 15% 12%, var(--accent-soft), transparent 42%);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 18px 14px 34px;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    /* Welcome Overlay */
    .splash-screen {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(8px);
      opacity: 0;
      transition: opacity 0.3s ease;
      cursor: pointer;
    }

    .splash-screen.open { display: flex; opacity: 1; }
    .splash-screen.fade-out { opacity: 0; }

    .splash-box {
      background: var(--bg-elevated);
      border: 1.5px solid var(--accent);
      box-shadow: var(--shadow-main);
      border-radius: 24px;
      padding: 26px 32px;
      text-align: center;
      max-width: 350px;
      width: 92%;
      animation: popIn 0.28s ease;
    }

    @keyframes popIn {
      from { transform: scale(0.93); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .toast-bar {
      display: none;
      padding: 11px 15px;
      border-radius: 14px;
      background: var(--accent-soft);
      border: 1px solid var(--accent);
      margin-bottom: 14px;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      font-weight: 600;
    }

    .toast-bar.show { display: flex; }

    /* Top Header */
    .top-bar {
      width: 100%;
      max-width: 900px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .brand-mark {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 1.18rem;
      font-weight: 700;
    }

    .brand-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--accent);
    }

    .header-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

    .glass-pill {
      padding: 7px 13px;
      border-radius: 999px;
      border: 1px solid var(--border-line);
      background: var(--bg-elevated);
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
    }

    /* Main Container */
    .shell-card {
      width: 100%;
      max-width: 900px;
      background: var(--bg-surface);
      border: 1px solid var(--border-line);
      box-shadow: var(--shadow-main);
      border-radius: 26px;
      padding: 24px 22px;
    }

    .auth-wrap { max-width: 440px; margin: 0 auto; }
    .auth-head { text-align: center; margin-bottom: 18px; }
    .auth-head h1 { font-size: 1.8rem; font-weight: 700; }
    .auth-head h1 span { color: var(--accent); }
    .auth-head p { font-size: 0.88rem; color: var(--text-dim); margin-top: 4px; }

    .seg-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      padding: 5px;
      border-radius: 14px;
      background: var(--bg-input);
      margin-bottom: 16px;
    }

    .seg-btn {
      padding: 8px 6px;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: var(--text-dim);
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    .seg-btn.active {
      background: var(--bg-elevated);
      color: var(--accent);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .seg-btn[data-auth="admin"].active { color: var(--admin); }

    .pane { display: none; }
    .pane.active { display: block; animation: popIn 0.2s ease; }

    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 5px; color: var(--text-dim); }

    .input-wrap { position: relative; display: flex; align-items: center; }

    .tech-input, .tech-textarea, .tech-select {
      width: 100%;
      padding: 10px 13px;
      border-radius: 12px;
      border: 1px solid var(--border-line);
      background: var(--bg-input);
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.94rem;
      outline: none;
    }

    .tech-textarea { min-height: 86px; resize: vertical; line-height: 1.5; }
    .tech-input:focus, .tech-textarea:focus, .tech-select:focus { border-color: var(--accent); }

    .eye-toggle {
      position: absolute;
      right: 10px;
      background: none;
      border: none;
      color: var(--text-dim);
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }

    .msg-box {
      display: none;
      padding: 10px 12px;
      border-radius: 11px;
      font-size: 0.85rem;
      margin-bottom: 12px;
      line-height: 1.4;
    }

    .msg-box.err {
      display: block;
      background: rgba(220, 38, 38, 0.12);
      color: var(--danger);
      border: 1px solid rgba(220, 38, 38, 0.28);
    }

    .msg-box.ok {
      display: block;
      background: rgba(5, 150, 105, 0.14);
      color: var(--success);
      border: 1px solid rgba(5, 150, 105, 0.28);
    }

    .btn-main {
      padding: 10px 16px;
      border: none;
      border-radius: 12px;
      background: var(--accent);
      color: #ffffff;
      font-family: inherit;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .w-full { width: 100%; }
    .btn-admin { background: var(--admin); }

    .btn-ghost {
      width: 100%;
      margin-top: 8px;
      padding: 9px 13px;
      border-radius: 12px;
      border: 1px solid var(--border-line);
      background: var(--bg-elevated);
      color: var(--text-dim);
      font-family: inherit;
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
    }

    .auth-links {
      margin-top: 11px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.84rem;
      flex-wrap: wrap;
    }

    .link-btn {
      background: none;
      border: none;
      color: var(--accent);
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      text-decoration: underline;
    }

    .id-result-box {
      margin-top: 12px;
      padding: 13px;
      border-radius: 14px;
      background: var(--bg-input);
      border: 1px solid var(--accent);
      text-align: center;
    }

    .id-num-big {
      font-size: 1.55rem;
      font-weight: 700;
      color: var(--gold);
      letter-spacing: 2px;
      margin: 4px 0;
    }

    /* Workspace & 3-Dot Menu */
    .workspace { display: none; }
    .workspace.active { display: block; animation: popIn 0.22s ease; }

    .ws-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      padding-bottom: 14px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border-line);
    }

    .profile-cluster { display: flex; align-items: center; gap: 11px; }

    .avatar-frame {
      width: 48px;
      height: 48px;
      border-radius: 15px;
      background: var(--bg-elevated);
      border: 1.5px solid var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      flex-shrink: 0;
    }

    .header-right-cluster {
      display: flex;
      align-items: center;
      gap: 9px;
      position: relative;
      flex-wrap: wrap;
    }

    .clock-pill {
      padding: 6px 12px;
      border-radius: 12px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-line);
      font-size: 0.84rem;
      font-weight: 700;
      color: var(--accent);
    }

    .dots-btn {
      width: 36px;
      height: 36px;
      border-radius: 11px;
      border: 1px solid var(--border-line);
      background: var(--bg-elevated);
      color: var(--text-main);
      font-size: 1.15rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .dots-menu {
      display: none;
      position: absolute;
      right: 0;
      top: 44px;
      z-index: 200;
      min-width: 210px;
      padding: 8px;
      border-radius: 16px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-line);
      box-shadow: var(--shadow-main);
      flex-direction: column;
      gap: 4px;
    }

    .dots-menu.open { display: flex; animation: popIn 0.16s ease; }

    .dots-item {
      width: 100%;
      text-align: left;
      padding: 9px 12px;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
    }

    .dots-item:hover, .dots-item.active {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .dots-item.logout-opt { color: var(--danger); }

    .sub-page { display: none; }
    .sub-page.active { display: block; }

    .panel-box {
      padding: 15px;
      border-radius: 16px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-line);
      margin-bottom: 14px;
    }

    .row-2 {
      display: grid;
      grid-template-columns: 1fr 150px;
      gap: 10px;
      margin-bottom: 10px;
    }

    .row-3 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
      margin-bottom: 10px;
    }

    @media (max-width: 560px) {
      .row-2 { grid-template-columns: 1fr; }
    }

    .days-check-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 6px;
    }

    .day-chip-btn {
      padding: 6px 10px;
      border-radius: 9px;
      border: 1px solid var(--border-line);
      background: var(--bg-input);
      color: var(--text-dim);
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }

    .day-chip-btn.picked {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }

    .empty-box {
      padding: 24px 16px;
      border-radius: 14px;
      background: var(--bg-input);
      border: 1px dashed var(--border-line);
      text-align: center;
      color: var(--text-dim);
      font-size: 0.9rem;
    }

    .card-item {
      padding: 13px 15px;
      border-radius: 15px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-line);
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      flex-wrap: wrap;
    }

    .sched-tag {
      display: inline-block;
      margin-left: 7px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.74rem;
      font-weight: 700;
      background: var(--accent-soft);
      color: var(--accent);
    }

    .reading-quote {
      margin-top: 8px;
      padding: 9px 12px;
      border-radius: 11px;
      background: var(--bg-input);
      border-left: 3px solid var(--accent);
      font-size: 0.9rem;
      line-height: 1.55;
      white-space: pre-wrap;
    }

    .counter-pill {
      display: inline-block;
      margin-top: 5px;
      padding: 2px 9px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 0.8rem;
      font-weight: 700;
    }

    .action-group { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

    .mini-btn {
      padding: 7px 12px;
      border-radius: 10px;
      border: 1px solid var(--border-line);
      background: var(--bg-input);
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }

    .mini-btn.accent-btn {
      background: var(--accent);
      color: #ffffff;
      border: none;
    }

    .mini-btn.danger-btn {
      color: var(--danger);
      border-color: rgba(220, 38, 38, 0.3);
    }

    .mini-btn.unlock-btn {
      background: var(--success);
      color: #ffffff;
      border: none;
    }

    .avatar-picker {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }

    .avatar-choice {
      padding: 12px;
      border-radius: 14px;
      background: var(--bg-input);
      border: 2px solid var(--border-line);
      color: var(--text-main);
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .avatar-choice.selected {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .palette-grid-20 {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 8px;
      margin-top: 8px;
      margin-bottom: 8px;
    }

    @media (max-width: 620px) {
      .palette-grid-20 { grid-template-columns: repeat(5, 1fr); }
    }

    .color-swatch-20 {
      width: 100%;
      aspect-ratio: 1 / 1;
      max-width: 32px;
      border-radius: 50%;
      border: 2px solid rgba(15, 23, 42, 0.16);
      cursor: pointer;
    }

    .color-swatch-20.active-swatch {
      outline: 2.5px solid var(--text-main);
      outline-offset: 2px;
    }

    .msg-thread-item {
      padding: 10px 12px;
      border-radius: 12px;
      background: var(--bg-input);
      border: 1px solid var(--border-line);
      margin-bottom: 8px;
      font-size: 0.88rem;
    }

    canvas#graphCanvas, canvas#reportGraphCanvas {
      width: 100%;
      height: 210px;
      display: block;
      margin-top: 10px;
    }

    .legend-row {
      display: flex;
      gap: 16px;
      margin-top: 8px;
      font-size: 0.84rem;
      color: var(--text-dim);
      flex-wrap: wrap;
    }

    .dot-swatch {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 5px;
    }

    .admin-user-card {
      padding: 14px 16px;
      border-radius: 15px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-line);
      margin-bottom: 12px;
    }

    .lock-pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.74rem;
      font-weight: 700;
      background: rgba(220, 38, 38, 0.14);
      color: var(--danger);
      margin-left: 6px;
    }

    .admin-meta-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
      gap: 8px;
      margin-top: 10px;
      font-size: 0.84rem;
      color: var(--text-dim);
    }

    .stat-chip {
      padding: 8px 10px;
      border-radius: 10px;
      background: var(--bg-input);
      border: 1px solid var(--border-line);
    }

    .code-badge {
      display: inline-block;
      margin-top: 5px;
      padding: 2px 9px;
      border-radius: 8px;
      background: var(--admin-soft);
      color: var(--admin);
      font-weight: 700;
      letter-spacing: 1px;
    }

    /* Printable Report Sheet Modal */
    .report-modal {
      position: fixed;
      inset: 0;
      z-index: 1100;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(6px);
      padding: 16px;
      overflow-y: auto;
    }

    .report-modal.open { display: flex; }

    .report-sheet {
      background: #ffffff;
      color: #0f172a;
      border-radius: 18px;
      padding: 24px;
      max-width: 780px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 24px 55px rgba(0, 0, 0, 0.35);
    }

    .report-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
      font-size: 0.86rem;
    }

    .report-table th, .report-table td {
      border: 1px solid #cbd5e1;
      padding: 7px 9px;
      text-align: left;
      vertical-align: top;
    }

    .report-table th { background: #f1f5f9; }

    @media print {
      body > *:not(#reportModal) { display: none !important; }
      #reportModal {
        position: static !important;
        display: block !important;
        background: none !important;
        padding: 0 !important;
      }
      .report-sheet { box-shadow: none !important; max-height: none !important; }
      .no-print { display: none !important; }
    }

    .footer-credit {
      margin-top: 20px;
      text-align: center;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--text-dim);
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <!-- Short Welcome Overlay -->
  <div id="welcomeOverlay" class="splash-screen" title="Click to dismiss">
    <div class="splash-box">
      <div style="font-size: 0.78rem; letter-spacing: 2px; color: var(--accent); font-weight: 700;">FIRDAUS</div>
      <h2 id="splashTitle" style="font-size: 1.3rem; margin-top: 6px;"></h2>
      <p id="splashCaption" style="font-size: 0.84rem; color: var(--text-dim); margin-top: 4px;"></p>
    </div>
  </div>

  <!-- Top Header -->
  <header class="top-bar">
    <div class="brand-mark">
      <span class="brand-dot"></span>
      <span>Firdaus</span>
    </div>

    <div class="header-controls">
      <button type="button" id="langBtn" class="glass-pill">EN / বাংলা</button>
      <button type="button" id="themeBtn" class="glass-pill"><span id="themeBtnTxt">Dark</span></button>
    </div>
  </header>

  <main class="shell-card">
    <!-- Auth Container -->
    <div id="authSection" class="auth-wrap">
      <div class="auth-head">
        <h1><span>Firdaus</span></h1>
        <p id="authSub"></p>
      </div>

      <div class="seg-tabs">
        <button type="button" class="seg-btn active" data-auth="login"><span id="tabLogin"></span></button>
        <button type="button" class="seg-btn" data-auth="register"><span id="tabReg"></span></button>
        <button type="button" class="seg-btn" data-auth="admin"><span id="tabAdmin"></span></button>
      </div>

      <div id="authAlert" class="msg-box" role="alert"></div>

      <!-- Login -->
      <form id="paneLogin" class="pane active" novalidate>
        <div class="field">
          <label id="lblLoginKey" for="loginKey"></label>
          <input type="text" id="loginKey" class="tech-input" placeholder="Name or ID" required />
        </div>

        <div class="field">
          <label id="lblLoginPass" for="loginPass"></label>
          <div class="input-wrap">
            <input type="password" id="loginPass" class="tech-input" placeholder="••••" required />
            <button type="button" class="eye-toggle" data-target="loginPass">Show</button>
          </div>
        </div>

        <button type="submit" id="btnLogin" class="btn-main w-full"></button>

        <div class="auth-links">
          <button type="button" id="linkReg" class="link-btn"></button>
          <button type="button" id="linkForgot" class="link-btn"></button>
        </div>
      </form>

      <!-- Register -->
      <form id="paneReg" class="pane" novalidate>
        <div class="field">
          <label id="lblRegName" for="regName"></label>
          <input type="text" id="regName" class="tech-input" placeholder="Name" required />
        </div>

        <div class="field">
          <label id="lblRegPass" for="regPass"></label>
          <div class="input-wrap">
            <input type="password" id="regPass" class="tech-input" placeholder="••••" required />
            <button type="button" class="eye-toggle" data-target="regPass">Show</button>
          </div>

    function updateClocks() {
      const now = new Date();
      const timeStr = now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
      const dateStr = now.toLocaleDateString(lang === "bn" ? "bn-BD" : "en-US", { weekday: "short", month: "short", day: "numeric" });
      const text = `${dateStr} • ${timeStr}`;
      const uClk = document.getElementById("liveClockBadge");
      const aClk = document.getElementById("adminClockBadge");
      if (uClk) uClk.textContent = text;
      if (aClk) aClk.textContent = text;
    }
    setInterval(updateClocks, 1000);
    updateClocks();

    function todayKey() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    }

    function isItemScheduledOnDate(item, dayStr) {
      const mode = item.scheduleType || "daily";
      if (mode === "daily") return true;
      if (mode === "weekdays") {
        const [y, m, day] = dayStr.split("-").map(Number);
        const wd = new Date(y, m - 1, day).getDay();
        return (item.weekdays || []).includes(wd);
      }
      if (mode === "custom") {
        const list = (item.customDates || "")
          .split(",")
          .map((s) => s.trim())
          .filter(Boolean);
        return list.includes(dayStr);
      }
      return true;
    }

    function scheduleBadgeText(item) {
      const mode = item.scheduleType || "daily";
      const labels = lang === "bn" ? DAY_NAMES_BN : DAY_NAMES_EN;
      if (mode === "weekdays") {
        const days = (item.weekdays || []).map((d) => labels[d]).join(", ");
        return days || (lang === "bn" ? "বার" : "Weekdays");
      }
      if (mode === "custom") {
        return item.customDates || (lang === "bn" ? "নির্দিষ্ট তারিখ" : "Specific Dates");
      }
      return lang === "bn" ? "Daily" : "Daily";
    }

    function applyCustomAccent(hex) {
      const fallback = document.documentElement.getAttribute("data-theme") === "dark" ? "#38bdf8" : "#0d9488";
      const validHex = /^#[0-9a-fA-F]{6}$/.test(hex) ? hex : fallback;
      document.documentElement.style.setProperty("--accent", validHex);
      const r = parseInt(validHex.slice(1, 3), 16);
      const g = parseInt(validHex.slice(3, 5), 16);
      const b = parseInt(validHex.slice(5, 7), 16);
      document.documentElement.style.setProperty("--accent-soft", `rgba(${r}, ${g}, ${b}, 0.15)`);

      const picker = document.getElementById("customColorPicker");
      if (picker) picker.value = validHex;
      const hexLbl = document.getElementById("colorHexLabel");
      if (hexLbl) hexLbl.textContent = validHex.toUpperCase();

      document.querySelectorAll(".color-swatch-20").forEach((sw) => {
        sw.classList.toggle("active-swatch", sw.dataset.col.toLowerCase() === validHex.toLowerCase());
      });

      const s = getSession();
      if (s && s.role === "user") renderGraph(s.id);
    }

      const key = document.getElementById("loginKey").value.trim();
      const pass = document.getElementById("loginPass").value.trim();

      const users = getUsers();
      const idx = users.findIndex((u) => u.id === key || u.name.toLowerCase() === key.toLowerCase());
      if (idx === -1) {
        showAuthAlert(lang === "bn" ? "নাম বা ID পাওয়া যায়নি।" : "User not found.", "err");
        return;
      }

      const target = users[idx];
      if (target.locked) {
        showAuthAlert(
          lang === "bn"
            ? "২ বার ভুল পাসওয়ার্ড দেওয়ায় এই ID লক হয়েছে। অ্যাডমিন আনলক করলে লগইন করতে পারবেন।"
            : "ID locked after 2 failed attempts. Ask Admin to unlock.",
          "err"
        );
        return;
      }

      if (target.pass !== pass) {
        target.failedAttempts = (target.failedAttempts || 0) + 1;
        if (target.failedAttempts >= 2) {
          target.locked = true;
          setUsers(users);
          showAuthAlert(
            lang === "bn"
              ? "২ বার ভুল পাসওয়ার্ড! ID লক করা হয়েছে।"

              : "Wrong password. 1 attempt left before lock.",

          );
        }
        return;
      }

      target.failedAttempts = 0;
      setUsers(users);

      if (!user.items) user.items = [];
      if (!user.history) user.history = {};

      if (!user.messages) user.messages = [];

      user.items.forEach((it) => {
        if (it.doneOn && it.doneOn !== day) {
          it.doneOn = null;
        }
      });

      const scheduledToday = user.items.filter((it) => isItemScheduledOnDate(it, day));
      const doneItems = scheduledToday.filter((it) => it.doneOn === day);
      const missedItems = scheduledToday.filter((it) => it.doneOn !== day);

      user.history[day] = {
        expected: scheduledToday.length,
        done: doneItems.length,
        missed: missedItems.length,
        missedTitles: missedItems.map((m) => m.title)
      };

    function openReportSheet(user) {
      document.getElementById("repSheetTitle").textContent = `${user.name} (ID: ${user.id}) — Detailed Amal Report`;
      document.getElementById("repSheetMeta").textContent = `Generated: ${todayKey()} • Summary & Missed Dates Breakdown`;

      const hist = user.history || {};
      const dates = Object.keys(hist).sort();
      let totalExpected = 0;
      let totalDone = 0;
      let totalMissed = 0;
      const missedDatesList = [];
      const tbody = document.getElementById("repTableBody");
      tbody.innerHTML = "";

      dates.forEach((d) => {
        const rec = hist[d] || {};
        const exp = rec.expected != null ? rec.expected : ((rec.done || 0) + (rec.missed || 0));
        const dn = rec.done || 0;
        const ms = rec.missed || 0;
        const mTitles = (rec.missedTitles && rec.missedTitles.length) ? rec.missedTitles.join(", ") : "-";

        totalExpected += exp;
        totalDone += dn;
        totalMissed += ms;
        if (ms > 0) missedDatesList.push(d);

        const tr = document.createElement("tr");
        tr.innerHTML = `<td>${d}</td><td>${exp}</td><td>${dn}</td><td>${ms}</td><td>${mTitles}</td>`;
        tbody.appendChild(tr);
      });

      document.getElementById("repSummaryCards").innerHTML = `
        <div style="padding:9px; border:1px solid #cbd5e1; border-radius:10px;">Total Expected: <strong>${totalExpected}</strong></div>
        <div style="padding:9px; border:1px solid #cbd5e1; border-radius:10px;">Total Done: <strong>${totalDone}</strong></div>
        <div style="padding:9px; border:1px solid #cbd5e1; border-radius:10px;">Total Missed: <strong>${totalMissed}</strong></div>
        <div style="padding:9px; border:1px solid #cbd5e1; border-radius:10px;">Missed Dates: <strong>${missedDatesList.length ? missedDatesList.join(", ") : "None"}</strong></div>
      `;

      document.getElementById("reportModal").classList.add("open");

      const rCanvas = document.getElementById("reportGraphCanvas");
      const rCtx = rCanvas.getContext("2d");
      rCtx.clearRect(0, 0, rCanvas.width, rCanvas.height);
      const sliceDates = dates.slice(-10);
      const maxV = Math.max(1, ...sliceDates.map((d) => Math.max(hist[d].done || 0, hist[d].missed || 0)));
      const plotH = rCanvas.height - 38;
      const slotW = (rCanvas.width - 50) / Math.max(1, sliceDates.length);

      sliceDates.forEach((d, idx) => {
        const x0 = 36 + idx * slotW;
        const bw = Math.min(18, slotW * 0.28);
        const dh = ((hist[d].done || 0) / maxV) * plotH;
        const mh = ((hist[d].missed || 0) / maxV) * plotH;

        rCtx.fillStyle = "#0d9488";
        rCtx.fillRect(x0 + slotW * 0.15, 12 + plotH - dh, bw, dh);

        rCtx.fillStyle = "#ef4444";
        rCtx.fillRect(x0 + slotW * 0.15 + bw + 4, 12 + plotH - mh, bw, mh);

        rCtx.fillStyle = "#334155";
        rCtx.font = "11px sans-serif";
        rCtx.textAlign = "center";
        rCtx.fillText(d.slice(5), x0 + slotW * 0.4, rCanvas.height - 7);
      });
    }

    function renderGraph(userId) {
      const canvas = document.getElementById("graphCanvas");
      if (!canvas) return;
      const ctx = canvas.getContext("2d");
      const users = getUsers();
      const u = users.find((x) => x.id === userId);
      const hist = (u && u.history) || {};
      const day = todayKey();

      const styles = getComputedStyle(document.documentElement);
      const doneCol = styles.getPropertyValue("--accent").trim() || "#0d9488";
      const dimCol = styles.getPropertyValue("--text-dim").trim() || "#64748b";
      const missCol = "#ef4444";

      const series = [];
      for (let off = 6; off >= 0; off--) {
        const d = new Date();
        d.setDate(d.getDate() - off);
        const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
        const lbl = d.toLocaleDateString(lang === "bn" ? "bn-BD" : "en-US", { weekday: "short" });
        let done = 0;
        let missed = 0;
        if (key === day && u) {
          const schedToday = u.items.filter((x) => isItemScheduledOnDate(x, day));
          done = schedToday.filter((x) => x.doneOn === day).length;
          missed = schedToday.filter((x) => x.doneOn !== day).length;
        } else if (hist[key]) {
          done = hist[key].done || 0;
          missed = hist[key].missed || 0;
        }
        series.push({ lbl, done, missed });
      }

      const w = canvas.width;
      const h = canvas.height;
      ctx.clearRect(0, 0, w, h);

      const maxVal = Math.max(1, ...series.map((s) => Math.max(s.done, s.missed)));
      const padL = 34;
      const padB = 28;
      const padT = 14;
      const plotH = h - padT - padB;
      const slotW = (w - padL - 12) / series.length;

      ctx.strokeStyle = "rgba(148, 163, 184, 0.2)";
      for (let g = 0; g <= 3; g++) {
        const y = padT + (plotH / 3) * g;
        ctx.beginPath();
        ctx.moveTo(padL, y);
        ctx.lineTo(w - 10, y);
        ctx.stroke();
      }

      series.forEach((pt, i) => {
        const x0 = padL + i * slotW;
        const bw = Math.min(22, slotW * 0.28);
        const dh = (pt.done / maxVal) * plotH;
        const mh = (pt.missed / maxVal) * plotH;

        ctx.fillStyle = doneCol;
        ctx.fillRect(x0 + slotW * 0.2, padT + plotH - dh, bw, dh);

        ctx.fillStyle = missCol;
        ctx.fillRect(x0 + slotW * 0.2 + bw + 5, padT + plotH - mh, bw, mh);

        ctx.fillStyle = dimCol;
        ctx.font = "12px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(pt.lbl, x0 + slotW * 0.45, h - 9);
      });
    }

      });
    }

    document.getElementById("adminUsersList").addEventListener("click", (e) => {
      const users = getUsers();
      if (e.target.dataset.admDel) {
        setUsers(users.filter((x) => x.id !== e.target.dataset.admDel));
        renderAdminControl();
      } else if (e.target.dataset.admReset) {
        const idx = users.findIndex((x) => x.id === e.target.dataset.admReset);
        if (idx !== -1) {
          users[idx].recoveryCode = String(Math.floor(100000 + Math.random() * 900000));
          users[idx].resetRequested = true;
          setUsers(users);
          renderAdminControl();
        }
      } else if (e.target.dataset.admUnlock) {
        const idx = users.findIndex((x) => x.id === e.target.dataset.admUnlock);
        if (idx !== -1) {
          users[idx].locked = false;
          users[idx].failedAttempts = 0;
          setUsers(users);
          renderAdminControl();
        }
      } else if (e.target.dataset.admPdf) {
        const idx = users.findIndex((x) => x.id === e.target.dataset.admPdf);
        if (idx !== -1) {
          users[idx].pdfApproved = true;
          users[idx].pdfRequested = false;
          setUsers(users);
          renderAdminControl();
        }
      } else if (e.target.dataset.admRmItem) {
        const [uid, itemIdStr] = e.target.dataset.admRmItem.split(":");
        const idx = users.findIndex((x) => x.id === uid);
        if (idx !== -1) {
          users[idx].items = (users[idx].items || []).filter((it) => String(it.id) !== itemIdStr);
          setUsers(users);
          renderAdminControl();
        }
      } else if (e.target.dataset.admReply) {
        const uid = e.target.dataset.admReply;
        const inp = document.getElementById(`replyInp_${uid}`);
        const text = inp ? inp.value.trim() : "";
        if (!text) return;
        const idx = users.findIndex((x) => x.id === uid);
        if (idx !== -1) {
          if (!users[idx].messages) users[idx].messages = [];
          users[idx].messages.push({
            sender: "admin",
            text,
            time: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })
          });
          setUsers(users);
          renderAdminControl();
        }
      }
    });

    function signOutAll() {
      localStorage.removeItem(DB_SESSION);
      document.getElementById("toastBanner").classList.remove("show");
      document.getElementById("userWorkspace").classList.remove("active");
      document.getElementById("adminWorkspace").classList.remove("active");
      document.getElementById("authSection").style.display = "block";
      applyCustomAccent(document.documentElement.getAttribute("data-theme") === "dark" ? "#38bdf8" : "#0d9488");
      switchAuthPane("login");
    }

    document.getElementById("btnLogoutUser").addEventListener("click", signOutAll);
    document.getElementById("btnLogoutAdmin").addEventListener("click", signOutAll);

    syncLanguage();
    const boot = getSession();
    if (boot) {
      if (boot.role === "admin") openAdminWorkspace(false);
      else if (boot.role === "user") openUserWorkspace(boot.id, false);
    }
  </script>
</body>
</html>
